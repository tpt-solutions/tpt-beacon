[workspace]
resolver = "2"
members = [
    "crates/beacon-server",
    "crates/beacon-semantic",
    "crates/beacon-keystone-client",
    "crates/beacon-anvil-client",
]

[workspace.lints.clippy]
all = "warn"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions"]
repository = "https://github.com/tpt-solutions/tpt-beacon"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"

[profile.release]
opt-level = 3
lto = "thin"
